on:
  release:
    types:
      - created
  push:
  pull_request:

permissions:
  # pages
  pages: write
  # releases
  contents: write
  # ghcr.io
  packages: write
  # idk what this is but actions/deploy-pages needs it
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ruby/setup-ruby@v1.327.0
        with:
          ruby-version: "4.0.7"
      - run: bundle install
        env:
          BUNDLE_RUBYGEMS__PKG__GITHUB__COM: ${{ secrets.GITHUB_TOKEN }}
      - run: bundle exec jekyll build
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: "_site"
      - uses: actions/deploy-pages@v5.0.1
        if: ${{ format('refs/heads/{0}', github.event.repository.default_branch) == github.ref || startsWith(github.ref, 'refs/tags/') }}
